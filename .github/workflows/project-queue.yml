name: Project FIFO
on:
  push:
    branches: ['governance/cwe-product-restart', 'agent/cs3-*']
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Regression and state consistency
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test_project_queue.py
          python3 -B tests/StatusAutomationTest.py
          bash scripts/check_docs_sync.sh
          python3 -B scripts/project_queue.py guard --base HEAD^
