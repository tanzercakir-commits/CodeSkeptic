name: Real-world scan

# On-demand re-validation of the README's real-world scan table on the
# current engine. Triggered by pushing to the `realworld-scan` branch
# (the dev sandbox cannot use workflow_dispatch — git protocol only).
# Each project is built with its own build system at a PINNED version,
# analyzed from its real compilation database with its idiom profile,
# and the resulting counts + reports are published to
# refs/ci-logs/<sha>/realworld for git-protocol readback.
#
# Scope: the projects whose builds fit a CI runner (libgit2,
# rtp2httpd). The heavyweights (systemd, shadPS4, llama.cpp) stay
# documented as hand-run campaigns.
on:
  push:
    branches: ["realworld-scan"]

permissions:
  contents: write

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev libclang-20-dev clang-20 \
            libzstd-dev zlib1g-dev ninja-build libssl-dev

      - name: Build CodeSkeptic
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20 \
            -DCODESKEPTIC_BUILD_TESTS=OFF
          cmake --build build

      - name: Scan libgit2 (pinned v1.9.0, idiom profile)
        run: |
          set -o pipefail
          curl -sL --retry 3 \
            https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.0.tar.gz \
            | tar xz
          cd libgit2-1.9.0
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF >/dev/null
          cd ..
          code=0
          ./build/src/codeskeptic libgit2-1.9.0/src \
            --build-path libgit2-1.9.0/build \
            --alloc-functions git__malloc,git__calloc,git__realloc,git__strdup \
            --free-functions git__free \
            --report-paths "$PWD/libgit2-1.9.0/src" \
            2>&1 | tee libgit2-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' libgit2-scan.log || true)
          echo "REALWORLD_RESULT project=libgit2 v=1.9.0 findings=$n exit=$code"
          echo "REALWORLD_RESULT project=libgit2 v=1.9.0 findings=$n" >> results.txt

      - name: Scan rtp2httpd (pinned, no profile needed)
        run: |
          set -o pipefail
          git clone --quiet --depth 1 https://github.com/stackia/rtp2httpd
          cd rtp2httpd
          # autotools project; a bear-style DB via compile flags is
          # overkill — the fallback per-extension DB parses plain C99.
          cd ..
          code=0
          ./build/src/codeskeptic rtp2httpd/src \
            --report-paths "$PWD/rtp2httpd/src" \
            2>&1 | tee rtp2httpd-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' rtp2httpd-scan.log || true)
          echo "REALWORLD_RESULT project=rtp2httpd findings=$n exit=$code"
          echo "REALWORLD_RESULT project=rtp2httpd findings=$n" >> results.txt

      - name: Deep corpus (abseil) for good measure
        run: |
          CORPUS_DEEP=1 bash scripts/run_corpus.sh ./build/src/codeskeptic corpus-work \
            2>&1 | tail -20 | tee -a results.txt

      - name: Publish results + logs to refs/ci-logs/*
        if: always()
        run: |
          tail -c 60000 libgit2-scan.log > libgit2.tail.log 2>/dev/null || true
          tail -c 30000 rtp2httpd-scan.log > rtp2httpd.tail.log 2>/dev/null || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f results.txt libgit2.tail.log rtp2httpd.tail.log 2>/dev/null || true
          git commit -qm "realworld scan @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/realworld"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/realworld/${{ job.status }}"

  # --- New-target probe+scan: curl + libexpat (F7A / CWE-120 showcase) ---
  # Both are plain CMake C projects: one configure emits a Clang-native
  # compile db, no OS-scale header generation. curl exercises the
  # Curl_c*/malloc wrappers and the null-passthrough slice; libexpat is
  # the natural home for the untrusted-length -> bounds arm (XML length
  # fields). Round 1 for each: configure, scan, and publish
  # processed/broken counts so a 0 is never mistaken for a clean (the
  # ReactOS lesson).
  scan-curl-expat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev libclang-20-dev clang-20 \
            libzstd-dev zlib1g-dev ninja-build libssl-dev

      - name: Build CodeSkeptic
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20 \
            -DCODESKEPTIC_BUILD_TESTS=OFF
          cmake --build build

      - name: Scan curl (pinned tag, Curl_ allocator idioms)
        run: |
          set -o pipefail
          curl -sL --retry 3 \
            https://github.com/curl/curl/archive/refs/tags/curl-8_11_0.tar.gz \
            | tar xz
          cd curl-curl-8_11_0
          cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF \
            -DCURL_USE_LIBPSL=OFF >/dev/null 2>&1 || \
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF >/dev/null 2>&1 || true
          cd ..
          test -f curl-curl-8_11_0/build/compile_commands.json && DB=ok || DB=absent
          echo "CURL_DB=$DB"
          code=0
          ./build/src/codeskeptic curl-curl-8_11_0/lib \
            --build-path curl-curl-8_11_0/build \
            --alloc-functions Curl_cmalloc,Curl_ccalloc,Curl_crealloc,Curl_cstrdup,curl_malloc,curl_calloc \
            --free-functions Curl_cfree,curl_free \
            --report-paths "$PWD/curl-curl-8_11_0/lib" \
            2>&1 | tee curl-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' curl-scan.log || true)
          broken=$(grep -c "failed to COMPILE" curl-scan.log || true)
          proc=$(grep -cE "^\[[0-9]+/[0-9]+\] Processing" curl-scan.log || true)
          echo "REALWORLD_RESULT project=curl v=8.11.0 findings=$n broken=$broken processed=$proc exit=$code" | tee -a results2.txt

      - name: Scan libexpat (pinned tag, untrusted-length showcase)
        run: |
          set -o pipefail
          curl -sL --retry 3 \
            https://github.com/libexpat/libexpat/archive/refs/tags/R_2_6_4.tar.gz \
            | tar xz
          cd libexpat-R_2_6_4/expat
          cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEXPAT_BUILD_TESTS=OFF -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TOOLS=OFF >/dev/null 2>&1 || true
          cd ../..
          test -f libexpat-R_2_6_4/expat/build/compile_commands.json && DB=ok || DB=absent
          echo "EXPAT_DB=$DB"
          code=0
          ./build/src/codeskeptic libexpat-R_2_6_4/expat/lib \
            --build-path libexpat-R_2_6_4/expat/build \
            --report-paths "$PWD/libexpat-R_2_6_4/expat/lib" \
            2>&1 | tee expat-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' expat-scan.log || true)
          broken=$(grep -c "failed to COMPILE" expat-scan.log || true)
          proc=$(grep -cE "^\[[0-9]+/[0-9]+\] Processing" expat-scan.log || true)
          echo "REALWORLD_RESULT project=libexpat v=2.6.4 findings=$n broken=$broken processed=$proc exit=$code" | tee -a results2.txt

      - name: Publish results + logs -> refs/ci-logs/*
        if: always()
        run: |
          for f in curl expat; do
            tail -c 60000 "${f}-scan.log" > "${f}.tail.log" 2>/dev/null || true
          done
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          for f in results2.txt curl.tail.log expat.tail.log; do
            [ -f "$f" ] && git add -f "$f"
          done
          git commit -qm "curl+expat scan @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/curl-expat"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/curl-expat/${{ job.status }}"
