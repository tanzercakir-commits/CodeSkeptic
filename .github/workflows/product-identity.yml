name: Product profile identity observation

# A new workflow_dispatch-only file cannot run off the default branch. This
# tightly scoped push lane needs no main change. Only the primary may push it.
on:
  push:
    branches: [agent/cs3-ch08-s01-u003-frozen-product-profiles]
    paths:
      - .github/workflows/product-identity.yml
      - scripts/product_identity.py
      - scripts/test_product_identity.py
      - scripts/product_profiles.py
      - scripts/test_product_profiles.py
      - tests/product_corpus/candidates/gcc-mixed-storage-binding.json

permissions:
  contents: read

concurrency:
  group: product-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Preserve committed source bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Observe installed Linux or macOS tools and header dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          identity_python="$(command -v python3)"
          "$identity_python" -B -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"'
          "$identity_python" -B -m unittest discover -s scripts -p test_product_identity.py -q
          if [[ "$RUNNER_OS" == Linux ]]; then
            identity_cc=/usr/bin/gcc
            identity_cxx=/usr/bin/g++
          else
            identity_cc=/usr/bin/clang
            identity_cxx=/usr/bin/clang++
          fi
          identity_clang="$(command -v clang)"
          identity_clangxx="$(command -v clang++)"
          "$identity_python" -B scripts/product_identity.py capture \
            --root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --cc "$identity_cc" --cxx "$identity_cxx" \
            --clang "$identity_clang" --clangxx "$identity_clangxx" \
            --output "$RUNNER_TEMP/codeskeptic-product-identity.json"
          # Explicitly fetch only the four hash-pinned ordinary GCC inputs.
          # Source and notices stay in runner temp and are never uploaded.
          "$identity_python" -B scripts/product_profiles.py stage-gcc-inputs \
            --root "$GITHUB_WORKSPACE" --external-root "$RUNNER_TEMP/codeskeptic-gcc-case"
          "$identity_python" -B -m unittest discover -s scripts -p test_product_profiles.py \
            -k GccStaging -k ExternalInput -q
          if [[ "$RUNNER_OS" == macOS ]]; then
            export DEVELOPER_DIR=/Library/Developer/CommandLineTools
            unset SDKROOT MACOSX_DEPLOYMENT_TARGET
            export SDKROOT="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
            export MACOSX_DEPLOYMENT_TARGET=14.0
            identity_cc="$DEVELOPER_DIR/usr/bin/clang"
            identity_cxx="$DEVELOPER_DIR/usr/bin/clang++"
            identity_clang="$identity_cc"
            identity_clangxx="$identity_cxx"
          fi
          "$identity_python" -B scripts/product_identity.py capture-case \
            --root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --external-root "$RUNNER_TEMP/codeskeptic-gcc-case" \
            --cc "$identity_cc" --cxx "$identity_cxx" \
            --clang "$identity_clang" --clangxx "$identity_clangxx" \
            --output "$RUNNER_TEMP/codeskeptic-native-case.json"

      - name: Observe installed MSVC, SDK and Clang header dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VSLANG: "1033"
        run: |
          $ErrorActionPreference = 'Stop'
          # Select once, before vcvars can change PATH; tests and capture share it.
          $identityPython = (Get-Command python.exe -ErrorAction Stop).Source
          & $identityPython -B -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"'
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.10+ required' }
          & $identityPython -B -m unittest discover -s scripts -p test_product_identity.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Focused metadata tests failed' }
          $identityLocator = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $identityVs = & $identityLocator -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $identityVs) { throw 'No installed x64 VC toolset' }
          # Configure this process only. No installer, environment file or system change.
          $identitySetup = Join-Path $identityVs 'VC\Auxiliary\Build\vcvars64.bat'
          $identityEnvironment = & cmd.exe /s /c "`"$identitySetup`" > NUL 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64 failed' }
          foreach ($identityLine in $identityEnvironment) {
            if ($identityLine -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          $identityCl = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe'
          $identityClang = (Get-Command clang.exe -ErrorAction Stop).Source
          $identityClangxx = (Get-Command clang++.exe -ErrorAction Stop).Source
          & $identityPython -B scripts/product_identity.py capture `
            --root "$env:GITHUB_WORKSPACE" --source-sha "$env:GITHUB_SHA" `
            --cc "$identityCl" --cxx "$identityCl" `
            --clang "$identityClang" --clangxx "$identityClangxx" `
            --output "$env:RUNNER_TEMP/codeskeptic-product-identity.json"
          if ($LASTEXITCODE -ne 0) { throw 'Identity observation failed' }
          & $identityPython -B scripts/product_profiles.py stage-gcc-inputs `
            --root "$env:GITHUB_WORKSPACE" --external-root "$env:RUNNER_TEMP/codeskeptic-gcc-case"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GCC source staging failed' }
          & $identityPython -B -m unittest discover -s scripts -p test_product_profiles.py `
            -k GccStaging -k ExternalInput -q
          if ($LASTEXITCODE -ne 0) { throw 'External input safety tests failed' }
          # Select a separate case-only standard-library include profile from the
          # observed VC/SDK roots. Do not relabel the original full vcvars record.
          $identityCaseSdk = Join-Path $env:WindowsSdkDir ('Include\' + $env:WindowsSDKVersion.TrimEnd('\', '/'))
          $identityCaseUcrt = Join-Path $env:UniversalCRTSdkDir ('Include\' + $env:UCRTVersion.TrimEnd('\', '/'))
          $identityCaseIncludes = @(
            (Join-Path $env:VCToolsInstallDir 'include'),
            (Join-Path $env:VCToolsInstallDir 'ATLMFC\include'),
            (Join-Path $identityCaseUcrt 'ucrt'),
            (Join-Path $identityCaseSdk 'shared'),
            (Join-Path $identityCaseSdk 'um'),
            (Join-Path $identityCaseSdk 'winrt'),
            (Join-Path $identityCaseSdk 'cppwinrt')
          )
          foreach ($identityCaseInclude in $identityCaseIncludes) {
            if (-not (Test-Path -LiteralPath $identityCaseInclude -PathType Container)) {
              throw 'Selected case include directory is missing'
            }
          }
          $env:INCLUDE = $identityCaseIncludes -join ';'
          & $identityPython -B scripts/product_identity.py capture-case `
            --root "$env:GITHUB_WORKSPACE" --source-sha "$env:GITHUB_SHA" `
            --external-root "$env:RUNNER_TEMP/codeskeptic-gcc-case" `
            --cc "$identityCl" --cxx "$identityCl" `
            --clang "$identityClang" --clangxx "$identityClangxx" `
            --output "$env:RUNNER_TEMP/codeskeptic-native-case.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native case observation failed' }

      - name: Retain only observed metadata, never SDK headers or compiler binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-identity-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/codeskeptic-product-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain case syntax and ABI metadata without source or SDK bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-case-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/codeskeptic-native-case.json
          if-no-files-found: error
          retention-days: 30

# Success means the observation file exists. The collector always records
# native_qualified=false, product_qualified=false and immutable_image=false.
# Preinstalled Clang selection is observed, NOT a promised LLVM-20 profile.
