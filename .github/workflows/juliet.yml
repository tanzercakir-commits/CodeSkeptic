name: Juliet benchmark

# Juliet score guard: runs on EVERY PR that touches analysis code
# (suite is cached, ~3.5 min) and dropping below the juliet_expected.txt
# baselines turns the job red (JULIET_GUARD_FAIL). Docs-only PRs are
# exempt via the paths filter. Results are tracked via JULIET_RESULT
# lines.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "File limit per CWE (0 = unlimited)"
        default: "400"
  schedule:
    - cron: "0 5 * * 1"  # Monday 05:00 UTC
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/juliet.yml"
      - "scripts/run_juliet.sh"
      - "scripts/juliet_eval.py"
      - "scripts/juliet_expected.txt"
      - "scripts/measurement_baseline.json"
      - "scripts/render_quality_dashboard.py"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
  push:
    # Existing phase path filters plus the explicit agent checkpoint path.
    # Agent pushes need no PR or default-branch workflow_dispatch registration.
    branches: ["phase*", "agent/cs3-*"]
    paths:
      - ".github/workflows/juliet.yml"
      - "scripts/run_juliet.sh"
      - "scripts/juliet_eval.py"
      - "scripts/juliet_expected.txt"
      - "scripts/measurement_baseline.json"
      - "scripts/render_quality_dashboard.py"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "ci/regression-checkpoint.json"

# Job-status mirroring (refs/status/*, see ci.yml) needs push rights.
permissions:
  contents: write

# Cost balance: back-to-back pushes to the same ref cancel the old run
concurrency:
  group: juliet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  juliet:
    # Don't run on drafts: the guard runs once per PR, at ready time
    # (build-and-test stays on every push — fast core signal).
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-20-dev libclang-20-dev libzstd-dev zlib1g-dev \
            clang-20 ninja-build unzip time

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20
          cmake --build build

      - name: Cache Juliet suite
        uses: actions/cache@v4
        with:
          path: juliet-work/juliet
          key: juliet-c-cpp-1.3

      - name: FN-classifier selftest
        run: python3 scripts/juliet_eval.py --selftest

      - name: Run benchmark
        # shell: bash → -eo pipefail: the tee pipe cannot mask the exit code
        # Limit: PR guard 400 (fast signal); weekly cron 1600 (deep
        # sampling — sparse flow variants like the 61-family don't make it
        # into the PR sample, the trend measurement should see them too)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LIMIT=1600
          else
            LIMIT="${{ github.event.inputs.limit || '400' }}"
          fi
          /usr/bin/time -v -o juliet-time.txt \
            bash scripts/run_juliet.sh ./build/src/codeskeptic juliet-work \
              "$LIMIT" | tee juliet-output.txt

      - name: Deep corpus (abseil) — weekly only
        # Real modern C++ FP net (CORPUS_DEEP gates the ~2.5 min abseil
        # leg out of PR runs — CI cost balance). Guarded by the pinned
        # count in corpus_expected.txt like the rest of the corpus.
        if: github.event_name == 'schedule'
        run: CORPUS_DEEP=1 bash scripts/run_corpus.sh ./build/src/codeskeptic corpus-work

      - name: Render rule quality dashboard
        if: always()
        run: |
          python3 scripts/render_quality_dashboard.py \
            --juliet-output juliet-output.txt \
            --baseline scripts/measurement_baseline.json \
            --time-output juliet-time.txt \
            --json-output juliet-dashboard.json \
            --markdown-output juliet-dashboard.md
          cat juliet-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality dashboard receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juliet-quality-${{ github.sha }}
          path: |
            juliet-output.txt
            juliet-time.txt
            juliet-dashboard.json
            juliet-dashboard.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish full output to refs/ci-logs/*
        # Always (not just on failure): the FN classification and FP
        # samples in this output ARE the working data of the recall
        # rounds — the sandbox reads them over the git protocol.
        if: always() && !startsWith(github.ref, 'refs/heads/agent/cs3-')
        run: |
          tail -c 120000 juliet-output.txt > juliet-output.tail.txt 2>/dev/null || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f juliet-output.tail.txt juliet-time.txt \
            juliet-dashboard.json juliet-dashboard.md
          git commit -qm "juliet output @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/juliet"

      - name: Mirror job status to refs/status/*
        if: always() && !startsWith(github.ref, 'refs/heads/agent/cs3-')
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/juliet/${{ job.status }}"
