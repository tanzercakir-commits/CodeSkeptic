name: Deterministic real-world campaign

# Phase 8 nightly, weekend, and release-candidate factory. The manifest is the sole project authority;
# this workflow supplies orchestration only. One matrix cell is one independent
# project repetition, so a failed project cannot erase another project's
# evidence and no hosted job pretends to span an aggregate campaign window.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Pinned campaign tier"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekend
          - release-candidate
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 0 * * 0"

permissions:
  contents: read

concurrency:
  group: realworld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tier: ${{ steps.tier.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Select immutable campaign tier
        id: tier
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = schedule ] && \
             [ "${{ github.event.schedule }}" = "43 0 * * 0" ]; then
            tier=weekend
          else
            tier="${{ github.event.inputs.tier || 'nightly' }}"
          fi
          case "$tier" in
            nightly|weekend|release-candidate) ;;
            *) echo "unsupported campaign tier: $tier" >&2; exit 2 ;;
          esac
          echo "value=$tier" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and emit project-by-repetition matrix
        id: matrix
        shell: bash
        run: |
          matrix=$(python3 scripts/run_realworld_campaign.py plan \
            --tier "${{ steps.tier.outputs.value }}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-analyzer:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the analyzer toolchain
        id: llvm
        shell: bash
        run: |
          if [ "${{ needs.plan.outputs.tier }}" = release-candidate ]; then
            version=19
          else
            version=20
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "root=/usr/lib/llvm-$version" >> "$GITHUB_OUTPUT"

      - name: Install the selected LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-${{ steps.llvm.outputs.version }}-dev \
            libclang-${{ steps.llvm.outputs.version }}-dev \
            clang-${{ steps.llvm.outputs.version }} \
            libzstd-dev zlib1g-dev ninja-build

      - name: Build one analyzer for every shard
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ steps.llvm.outputs.root }} \
            -DLLVM_DIR=${{ steps.llvm.outputs.root }}/lib/cmake/llvm \
            -DClang_DIR=${{ steps.llvm.outputs.root }}/lib/cmake/clang \
            -DCODESKEPTIC_BUILD_TESTS=OFF
          cmake --build build --parallel 2
          sha256sum build/src/codeskeptic

      - name: Publish immutable analyzer input
        uses: actions/upload-artifact@v4
        with:
          name: realworld-analyzer-${{ github.sha }}
          path: build/src/codeskeptic
          if-no-files-found: error
          retention-days: 14

  scan:
    needs: [plan, build-analyzer]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install project build dependencies
        run: |
          compiler_packages=(clang-20)
          if [ "${{ needs.plan.outputs.tier }}" = release-candidate ]; then
            compiler_packages+=(clang-19 mold clang-tools-19 libasound2-dev libdecor-0-dev libgles2-mesa-dev libglfw3-dev libopenal-dev libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y \
            "${compiler_packages[@]}" cmake ninja-build libssl-dev libxml2-dev \
            libbz2-dev liblzma-dev libzstd-dev zlib1g-dev \
            meson bear gperf libcap-dev libmount-dev

      - name: Download the shared analyzer
        uses: actions/download-artifact@v4
        with:
          name: realworld-analyzer-${{ github.sha }}
          path: analyzer

      - name: Restore exact-identity checkpoint
        uses: actions/cache@v4
        with:
          path: realworld-checkpoints
          key: >-
            realworld-v1-${{ github.sha }}-${{ hashFiles('scripts/realworld_manifest.json') }}-
            ${{ matrix.project }}-${{ matrix.repetition }}

      - name: Run one independent project repetition
        shell: bash
        run: |
          chmod +x analyzer/codeskeptic
          python3 scripts/run_realworld_campaign.py run \
            --project "${{ matrix.project }}" \
            --repetition "${{ matrix.repetition }}" \
            --analyzer analyzer/codeskeptic \
            --workspace campaign-work \
            --output "evidence/${{ matrix.project }}/repeat-${{ matrix.repetition }}/receipt.json" \
            --checkpoint "realworld-checkpoints/${{ matrix.project }}/repeat-${{ matrix.repetition }}/receipt.json"

      - name: Upload shard evidence even when unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworld-${{ matrix.project }}-repeat-${{ matrix.repetition }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: [plan, build-analyzer, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download every independent shard receipt
        uses: actions/download-artifact@v4
        with:
          pattern: realworld-*-repeat-*
          path: receipts
          merge-multiple: true

      - name: Verify checksums, exact coverage, and three-repeat determinism
        run: |
          python3 scripts/run_realworld_campaign.py aggregate \
            --tier "${{ needs.plan.outputs.tier }}" \
            --receipts receipts \
            --output aggregate/receipt.json
          cat aggregate/receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate referee receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworld-aggregate-${{ github.sha }}
          path: aggregate
          if-no-files-found: error
          retention-days: 30
