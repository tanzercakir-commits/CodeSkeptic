name: "CodeSkeptic Analyze"
description: >-
  Precision-first C/C++ static analysis with dataflow traces.
  Installs a checksum-verified local artifact or release binary, analyzes your code, and can
  upload SARIF to GitHub code scanning. Default gate is report-only:
  findings are reported but do not fail the job until you opt in.
author: "tanzercakir-commits"
branding:
  icon: "search"
  color: "gray-dark"

inputs:
  path:
    description: "Directory or file to analyze"
    required: false
    default: "."
  build-path:
    description: "Directory containing compile_commands.json (strongly recommended)"
    required: false
    default: ""
  sarif:
    description: "New SARIF output path (existing files are preserved and rejected)"
    required: false
    default: "codeskeptic.sarif"
  upload-sarif:
    description: "Upload the SARIF to GitHub code scanning (needs security-events: write)"
    required: false
    default: "false"
  gate:
    description: >-
      report-only (default): supported findings inform without failing the job.
      error: fail on supported/blocking findings — opt in AFTER a report-only
      adoption week. Experimental findings always remain report-only.
    required: false
    default: "report-only"
  version:
    description: >-
      Release tag to use (e.g. v0.4.8). Default: the tag the action
      itself is pinned to (uses: ...@v0.4.8 analyzes with the v0.4.8
      binary), so pinning the action pins the analyzer — set "latest"
      explicitly if you WANT the newest release every run.
      Branch, commit SHA and local action references require this explicit input
      or a local artifact; they never silently select latest.
    required: false
    default: ""
  artifact-path:
    description: "Trusted local Linux x86_64 package tar.gz; no download. Mutually exclusive with version."
    required: false
    default: ""
  artifact-sha256:
    description: "Required exact SHA-256 for artifact-path; integrity check, not a producer signature."
    required: false
    default: ""
  timeout-seconds:
    description: "Analysis time limit, 1..3600 seconds; timeout remains a failure in both gates."
    required: false
    default: "300"
  extra-args:
    description: "Extra CLI arguments (e.g. --alloc-functions my_malloc --report-paths $GITHUB_WORKSPACE/src)"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Raw analyzer exit code (0 no blocking findings, 1 supported findings, 2 unavailable)"
    value: ${{ steps.analyze.outputs.exit-code }}
  sarif-valid:
    description: "true only for a fresh native report consistent with the observed analyzer verdict"
    value: ${{ steps.analyze.outputs.sarif-valid }}

runs:
  using: "composite"
  steps:
    - name: Validate action inputs
      shell: bash
      env:
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_SARIF_PATH: ${{ inputs.sarif }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$INPUT_GATE" in
          report-only|error) ;;
          *) echo "::error::gate must be 'report-only' or 'error'"; exit 2 ;;
        esac
        case "$INPUT_UPLOAD_SARIF" in
          true|false) ;;
          *) echo "::error::upload-sarif must be 'true' or 'false'"; exit 2 ;;
        esac
        test -n "$INPUT_SARIF_PATH" || {
          echo "::error::sarif output path must not be empty"; exit 2; }
        case "$INPUT_VERSION" in
          ""|latest|v[0-9]*) ;;
          *) echo "::error::version must be 'latest' or a v* release tag"; exit 2 ;;
        esac

    - name: Download CodeSkeptic release
      if: ${{ inputs.artifact-path == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
        INPUT_ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
      run: |
        set -euo pipefail
        python3 -B "$GITHUB_ACTION_PATH/scripts/action_acquire.py" release

    - name: Install local CodeSkeptic artifact
      if: ${{ inputs.artifact-path != '' }}
      shell: bash
      env:
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
        INPUT_ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python3 -B "$GITHUB_ACTION_PATH/scripts/action_acquire.py" local

    - name: Analyze
      id: analyze
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BUILD_PATH: ${{ inputs.build-path }}
        INPUT_SARIF_PATH: ${{ inputs.sarif }}
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        python3 -B "$GITHUB_ACTION_PATH/scripts/action_run.py"

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-valid == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
