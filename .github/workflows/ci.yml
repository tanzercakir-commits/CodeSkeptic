name: CI

on:
  push:
    # phase* branches: the dev sandbox drives this repo over the git
    # protocol only (no REST API), so feature work pushed as phase*
    # gets CI on push and reads the verdict from refs/status/* (see
    # the last step) without needing a PR to exist first.
    branches: [main, "phase*", "agent/cs3-*"]
  pull_request:

# Job-status mirroring (refs/status/*) needs push rights.
permissions:
  contents: write

# Cost balance: back-to-back pushes to the same ref cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Full history: the doc guard's changelog-freshness (3) and
        # state-block (6) checks both need a merge-base with main. The
        # default depth-1 checkout has none, so BOTH silently skipped —
        # a green lane running an unexecuted guard, from c8ca617 until
        # 2026-08-01. The guard now FAILS rather than notes when it
        # cannot resolve a base under CI; this line is what keeps it
        # resolvable.
        with:
          fetch-depth: 0

      - name: Doc-hygiene guard (canonical files, no scatter, changelog fresh)
        run: bash scripts/check_docs_sync.sh

      - name: Install LLVM 20 and build tools
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-20-dev libclang-20-dev libzstd-dev zlib1g-dev \
            clang-20 ninja-build

      - name: Check agent workflow policy
        id: workflow-policy
        if: success() && startsWith(github.ref, 'refs/heads/agent/cs3-')
        run: |
          sudo apt-get install -y python3-yaml
          /usr/bin/python3 -B tests/WorkflowPolicyTest.py

      - name: Configure
        id: configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20

      - name: Build
        id: build
        run: cmake --build build

      - name: Test
        id: test
        run: ctest --test-dir build --output-on-failure

      - name: Test (single process)
        id: test-single
        # ctest runs each test in its own process — it cannot see
        # global-state leakage between tests (this is how McpServerTest's
        # filter leak hid 11 interproc tests). The same binary is also
        # run in a single process so contamination becomes visible.
        run: ./build/tests/codeskeptic_tests

      - name: Smoke test
        id: smoke
        run: |
          cat > /tmp/smoke.cpp << 'EOF'
          int use_after_free() {
              int* p = new int(42);
              delete p;
              return *p;
          }
          EOF
          # Exit 1 is reserved for supported/blocking findings. Use-after-free
          # is quality-gated; an experimental-only fixture would correctly
          # return 0 while still reporting its finding.
          code=0
          ./build/src/codeskeptic /tmp/smoke.cpp || code=$?
          test "$code" -eq 1

      - name: Self-scan (dogfood gate)
        id: selfscan
        # The analyzer analyzes its own sources — with the founding
        # policy active. Experimental rules are product-level report-only,
        # but this repository's dogfood quality gate deliberately requires
        # zero findings of either tier.
        run: |
          code=0
          ./build/src/codeskeptic src/ --build-path build \
            --policy no-absolute-paths --json /tmp/selfscan.json || code=$?
          test "$code" -eq 0
          python3 -c 'import json; data=json.load(open("/tmp/selfscan.json")); assert data["total"] == 0, data["total"]'

      - name: Real-world corpus (cJSON + tinyxml2)
        id: corpus
        run: bash scripts/run_corpus.sh ./build/src/codeskeptic /tmp/corpus

      - name: Thesis gate (blind AI first-draft corpus)
        id: thesis
        # The mission-axis gate: a frozen corpus of first-draft C
        # written by rule-blind generators. Clean files must stay 0
        # (precision), buggy files must not drop below their pinned
        # floor (recall). tests/thesis_corpus/thesis_expected.txt.
        run: bash scripts/run_thesis.sh ./build/src/codeskeptic

      - name: Collect agent job diagnostics (not a qualification receipt)
        id: agent-evidence
        if: always() && startsWith(github.ref, 'refs/heads/agent/cs3-')
        shell: bash
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/codeskeptic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          target = Path(os.environ["SNAPSHOT_DIR"])
          target.mkdir()  # Never reuse a stale snapshot or follow its symlink.
          checkout = subprocess.run(["git", "rev-parse", "HEAD"], text=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          snapshot = {
              "schema": "codeskeptic-ci-snapshot/v1",
              "purpose": "diagnostics-only; not a final job verdict or qualification receipt",
              "event_sha": os.environ["GITHUB_SHA"],
              "checkout_sha": checkout.stdout.strip() if checkout.returncode == 0 else None,
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "steps": {key: {field: value.get(field) for field in ("outcome", "conclusion")}
                        for key, value in json.loads(os.environ["STEPS_JSON"]).items()},
              "logs": {},
          }
          # Fixed allowlist, no recursive workspace upload, no test reruns.
          for name in ("build/Testing/Temporary/LastTest.log",
                       "build/Testing/Temporary/LastTestsFailed.log",
                       "build/CMakeFiles/CMakeConfigureLog.yaml", "probe_result.txt"):
              source = Path(name)
              if any(p.is_symlink() for p in (source, *source.parents)) or not source.is_file():
                  snapshot["logs"][name] = {"available": False}
                  continue
              with source.open("rb") as stream:
                  size = stream.seek(0, 2)
                  stream.seek(max(0, size - 65536))
                  data = stream.read(65536)
              (target / source.name).write_bytes(data)
              snapshot["logs"][name] = {"available": True, "bytes": len(data), "truncated": size > len(data)}
          (target / "snapshot.json").write_text(json.dumps(snapshot, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload agent job diagnostics
        id: agent-upload
        if: always() && startsWith(github.ref, 'refs/heads/agent/cs3-') && steps.agent-evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeskeptic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Failure diagnostics -> refs/ci-logs/*
        # The sandbox cannot read Actions logs (git protocol only). On
        # failure: record per-step outcomes, re-run the failed tests
        # and the self-scan with output captured, and push the lot as
        # a commit under refs/ci-logs/<sha>/build-and-test.
        if: failure() && !startsWith(github.ref, 'refs/heads/agent/cs3-')
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.outcome)"' \
            > /tmp/diag/steps.txt 2>/dev/null || echo "$STEPS_JSON" > /tmp/diag/steps.txt
          ctest --test-dir build --rerun-failed --output-on-failure \
            > /tmp/diag/ctest_failed.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest_failed.txt > /tmp/diag/ctest_failed_tail.txt || true
          ./build/src/codeskeptic src/ --build-path build --policy no-absolute-paths \
            > /tmp/diag/selfscan.txt 2>&1 || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/steps.txt /tmp/diag/ctest_failed_tail.txt /tmp/diag/selfscan.txt .
          git add -f steps.txt ctest_failed_tail.txt selfscan.txt
          git commit -qm "ci diagnostics @ ${{ github.sha }}"
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/build-and-test"

      - name: Mirror job status to refs/status/*
        # The dev sandbox can reach this repo over the git protocol
        # only (no REST API), so the job's conclusion is published as
        # a lightweight ref it can read with `git ls-remote`:
        #   refs/status/<sha>/build-and-test/<success|failure|cancelled>
        # Namespaced refs are invisible as branches and trigger nothing.
        if: always() && !startsWith(github.ref, 'refs/heads/agent/cs3-')
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/build-and-test/${{ job.status }}"
