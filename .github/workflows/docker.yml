name: Docker

# phase* pushes and PRs touching the image: build + smoke only (the
# gate). A successful Release workflow additionally publishes to
# ghcr.io as its exact tag and latest. The smoke is the same contract
# as the release tarball's:
# analyze docs/demo.c in the fresh image -> exactly exit 1, findings
# present.
on:
  push:
    branches: ["phase*"]
    paths:
      - "Dockerfile"
      - "scripts/package_release.sh"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "scripts/package_release.sh"
      - ".github/workflows/docker.yml"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to rebuild (for example v0.4.8)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Keep the workflow revision's Dockerfile as the trusted build recipe.
      # Historical release tags may predate recipe-only fixes (for example the
      # explicit version build argument), so the immutable tag is checked out
      # separately and used only as the image's source context.
      - name: Checkout workflow source
        uses: actions/checkout@v4

      - name: Checkout exact release source
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          path: release-source

      - name: Build image
        id: build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -o pipefail
          args=()
          context="."
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            args+=(--build-arg "CODESKEPTIC_VERSION_OVERRIDE=${RELEASE_TAG#v}")
            context="release-source"
          fi
          docker build "${args[@]}" -f "$PWD/Dockerfile" -t codeskeptic:test "$context" 2>&1 | tee /tmp/docker_build.log

      - name: Smoke (fresh image, demo.c, exit 1 + findings)
        id: smoke
        run: |
          docs="$PWD/docs"
          if [ -d "$PWD/release-source/docs" ]; then
            docs="$PWD/release-source/docs"
          fi
          code=0
          out=$(docker run --rm -v "$docs:/work:ro" codeskeptic:test demo.c 2>&1) || code=$?
          echo "$out" | tee /tmp/docker_smoke.log
          echo "exit_code=$code" >> /tmp/docker_smoke.log
          test "$code" -eq 1
          echo "$out" | grep -qi finding

      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure()
        run: |
          tail -c 30000 /tmp/docker_build.log > build_tail.log 2>/dev/null || true
          cp /tmp/docker_smoke.log smoke.log 2>/dev/null || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f build_tail.log smoke.log 2>/dev/null || git add -f build_tail.log || true
          git commit -qm "ci diagnostics: docker @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/docker"

      - name: Publish exact release identity to ghcr.io
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success') ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/codeskeptic
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
        run: |
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          test "$draft" = "false"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMG="$IMAGE"
          VER=$(docker run --rm codeskeptic:test --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          test "$RELEASE_TAG" = "v$VER"
          docker tag codeskeptic:test "$IMG:$RELEASE_TAG"
          docker tag codeskeptic:test "$IMG:latest"
          docker push "$IMG:$RELEASE_TAG"
          docker push "$IMG:latest"

      # One-shot Phase 0 repair. Remove this step after the exact stale
      # package version has been deleted and the receipt is recorded.
      - name: Remove exact legacy v0.4.9 package version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v0.4.8'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: codeskeptic
          LEGACY_TAG: v0.4.9
          LEGACY_DIGEST: sha256:03b346e66f1b292a5c2a1ddd1b5cb9190d21899077b6d646eee115f320d6197c
          CURRENT_DIGEST: sha256:039b10d81dbceb6cd8d16c93c4e640b84febc55e02365b0537e78652f90e9f56
        run: |
          endpoint="/users/$OWNER/packages/container/$PACKAGE_NAME/versions?per_page=100"
          versions=$(gh api -H "Accept: application/vnd.github+json" "$endpoint")
          count=$(jq 'length' <<<"$versions")
          test "$count" -lt 100

          current_before=$(jq -c --arg digest "$CURRENT_DIGEST" '
            [.[] | select(
              .name == $digest and
              (((.metadata.container.tags // []) | index("v0.4.8")) != null) and
              (((.metadata.container.tags // []) | index("latest")) != null)
            )]
          ' <<<"$versions")
          test "$(jq 'length' <<<"$current_before")" -eq 1

          matches=$(jq -c --arg tag "$LEGACY_TAG" --arg digest "$LEGACY_DIGEST" '
            [.[] | select(
              .name == $digest or
              (((.metadata.container.tags // []) | index($tag)) != null)
            )]
          ' <<<"$versions")
          test "$(jq 'length' <<<"$matches")" -eq 1

          version=$(jq -c '.[0]' <<<"$matches")
          digest=$(jq -r '.name' <<<"$version")
          tag_count=$(jq '.metadata.container.tags | length' <<<"$version")
          only_tag=$(jq -r '.metadata.container.tags[0]' <<<"$version")
          test "$digest" = "$LEGACY_DIGEST"
          test "$tag_count" -eq 1
          test "$only_tag" = "$LEGACY_TAG"

          version_id=$(jq -r '.id' <<<"$version")
          gh api --method DELETE \
            "/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$version_id"

          remaining_versions=$(gh api -H "Accept: application/vnd.github+json" "$endpoint")
          remaining=$(jq --arg tag "$LEGACY_TAG" --arg digest "$LEGACY_DIGEST" '
            [.[] | select(
              .name == $digest or
              (((.metadata.container.tags // []) | index($tag)) != null)
            )] | length
          ' <<<"$remaining_versions")
          test "$remaining" -eq 0

          current_after=$(jq -c --arg digest "$CURRENT_DIGEST" '
            [.[] | select(
              .name == $digest and
              (((.metadata.container.tags // []) | index("v0.4.8")) != null) and
              (((.metadata.container.tags // []) | index("latest")) != null)
            )]
          ' <<<"$remaining_versions")
          test "$(jq 'length' <<<"$current_after")" -eq 1

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/docker/${{ job.status }}"
