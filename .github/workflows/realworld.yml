name: Real-world scan

# On-demand re-validation of the README's real-world scan table on the
# current engine. Triggered by pushing to the `realworld-scan` branch
# (the dev sandbox cannot use workflow_dispatch — git protocol only).
# Each project is built with its own build system at a PINNED revision,
# analyzed only across the translation units in its real compilation
# database with its idiom profile,
# and the resulting counts + reports are published to
# refs/ci-logs/<sha>/realworld for git-protocol readback.
#
# Scope: the projects whose builds fit a CI runner (libgit2,
# rtp2httpd). The heavyweights (systemd, shadPS4, llama.cpp) stay
# documented as hand-run campaigns.
on:
  push:
    branches: ["realworld-scan"]

permissions:
  contents: write

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate real-world replay ledger
        run: python3 scripts/check_realworld_ledger.py

      - name: Install LLVM 20 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev libclang-20-dev clang-20 \
            libzstd-dev zlib1g-dev ninja-build libssl-dev

      - name: Build CodeSkeptic
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20 \
            -DCODESKEPTIC_BUILD_TESTS=OFF
          cmake --build build

      - name: Scan libgit2 (ledger-pinned revision, idiom profile)
        run: |
          set -euo pipefail
          mapfile -t ledger < <(awk '!/^#/ && $1 == "libgit2" { print }' \
            scripts/realworld_expected.txt)
          test "${#ledger[@]}" -eq 1
          read -r _ revision label expected_tus expected_findings expected_exit _ _ \
            <<< "${ledger[0]}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 2
          git init -q libgit2
          git -C libgit2 remote add origin https://github.com/libgit2/libgit2
          git -C libgit2 fetch -q --depth 1 origin "$revision"
          git -C libgit2 checkout -q --detach FETCH_HEAD
          cmake -S libgit2 -B libgit2/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF >/dev/null
          cmake --build libgit2/build
          root=$(realpath libgit2/src)
          jq -r --arg root "$root/" \
            '.[] | .file | select(startswith($root))' \
            libgit2/build/compile_commands.json \
            | sort -u > libgit2.files
          test -s libgit2.files
          tus=$(wc -l < libgit2.files)
          code=0
          ./build/src/codeskeptic --files libgit2.files \
            --build-path libgit2/build \
            --alloc-functions git__malloc,git__calloc,git__realloc,git__strdup \
            --free-functions git__free \
            --report-paths "$PWD/libgit2/src" \
            2>&1 | tee libgit2-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' libgit2-scan.log || true)
          echo "REALWORLD_RESULT project=libgit2 revision=$revision label=$label tus=$tus findings=$n exit=$code"
          echo "REALWORLD_RESULT project=libgit2 revision=$revision label=$label tus=$tus findings=$n exit=$code" >> results.txt
          test "$tus" -eq "$expected_tus"
          test "$code" -eq "$expected_exit"
          test "$n" -eq "$expected_findings"

      - name: Scan rtp2httpd (ledger-pinned revision, no profile needed)
        run: |
          set -euo pipefail
          mapfile -t ledger < <(awk '!/^#/ && $1 == "rtp2httpd" { print }' \
            scripts/realworld_expected.txt)
          test "${#ledger[@]}" -eq 1
          read -r _ revision label expected_tus expected_findings expected_exit _ _ \
            <<< "${ledger[0]}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 2
          # The 2026-07-22 campaign scanned then-current HEAD; this is
          # the last upstream commit preceding that recorded run.
          git init -q rtp2httpd
          git -C rtp2httpd remote add origin https://github.com/stackia/rtp2httpd
          git -C rtp2httpd fetch -q --depth 1 origin "$revision"
          git -C rtp2httpd checkout -q --detach FETCH_HEAD
          cmake -S rtp2httpd -B rtp2httpd/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build rtp2httpd/build
          root=$(realpath rtp2httpd/src)
          jq -r --arg root "$root/" \
            '.[] | .file | select(startswith($root))' \
            rtp2httpd/build/compile_commands.json \
            | sort -u > rtp2httpd.files
          test -s rtp2httpd.files
          tus=$(wc -l < rtp2httpd.files)
          code=0
          ./build/src/codeskeptic --files rtp2httpd.files \
            --build-path rtp2httpd/build \
            --report-paths "$PWD/rtp2httpd/src" \
            2>&1 | tee rtp2httpd-scan.log || code=$?
          n=$(grep -cE '\.(c|h):[0-9]+:[0-9]+ \[(warning|error)\]' rtp2httpd-scan.log || true)
          echo "REALWORLD_RESULT project=rtp2httpd revision=$revision label=$label tus=$tus findings=$n exit=$code"
          echo "REALWORLD_RESULT project=rtp2httpd revision=$revision label=$label tus=$tus findings=$n exit=$code" >> results.txt
          test "$tus" -eq "$expected_tus"
          test "$code" -eq "$expected_exit"
          test "$n" -eq "$expected_findings"

      - name: Deep corpus (abseil) for good measure
        run: |
          CORPUS_DEEP=1 bash scripts/run_corpus.sh ./build/src/codeskeptic corpus-work \
            2>&1 | tail -20 | tee -a results.txt

      - name: Publish results + logs to refs/ci-logs/*
        if: always()
        run: |
          tail -c 60000 libgit2-scan.log > libgit2.tail.log 2>/dev/null || true
          tail -c 30000 rtp2httpd-scan.log > rtp2httpd.tail.log 2>/dev/null || true
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f results.txt libgit2.tail.log rtp2httpd.tail.log 2>/dev/null || true
          git commit -qm "realworld scan @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/realworld"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/realworld/${{ job.status }}"
