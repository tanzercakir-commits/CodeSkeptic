name: Action self-test

# Feature pushes test offline helpers. Released artifacts are a separate lane.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release tag, or explicitly choose latest"
        required: true
        type: string
  push:
    branches: ["agent/**"]
    paths: [".github/workflows/action-selftest.yml", "action.yml", "scripts/action*.py", "Dockerfile", ".dockerignore"]

permissions:
  contents: read

jobs:
  helper-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline helper regressions
        run: |
          python3 -B tests/ActionArgsTest.py
          python3 -B tests/DockerWorkflowTest.py
          python3 -B scripts/action_test.py
          python3 -B scripts/action_acquire_test.py
          python3 -B scripts/action_container_test.py

  released-asset:
    if: github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTED_VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Run the action on docs/demo.c (report-only)
        id: run
        uses: ./
        with:
          path: docs/demo.c
          sarif: selftest.sarif
          upload-sarif: "false"
          gate: report-only
          version: ${{ env.SELECTED_VERSION }}
      - name: Run the action a second time with the same explicit version
        id: pinned
        uses: ./
        with:
          path: docs/demo.c
          sarif: pinned.sarif
          upload-sarif: "false"
          gate: report-only
          version: ${{ env.SELECTED_VERSION }}
      - name: Verify native reports and version identity
        env:
          FIRST_EXIT: ${{ steps.run.outputs.exit-code }}
          SECOND_EXIT: ${{ steps.pinned.outputs.exit-code }}
          FIRST_VALID: ${{ steps.run.outputs.sarif-valid }}
          SECOND_VALID: ${{ steps.pinned.outputs.sarif-valid }}
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from action_run import validate
          identity = subprocess.check_output(['codeskeptic', '--version'], text=True).strip()
          assert identity.startswith('CodeSkeptic ')
          version = identity.removeprefix('CodeSkeptic ')
          selected = os.environ['SELECTED_VERSION']
          assert selected == 'latest' or selected == 'v' + version
          documents = []
          for prefix, path in (('FIRST', 'selftest.sarif'), ('SECOND', 'pinned.sarif')):
              assert os.environ[prefix + '_EXIT'] == '1'
              assert os.environ[prefix + '_VALID'] == 'true'
              document = json.loads(Path(path).read_text())
              validate(document, 1, version)
              documents.append(document)
          assert documents[0] == documents[1]
          print('RELEASED_ACTION_OK two_invocations=2 raw_exit=1 step_exit=0 version=' + version)
          PY
