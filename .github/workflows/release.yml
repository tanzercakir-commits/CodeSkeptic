name: Release

# Tag push v* -> build, package (scripts/package_release.sh), smoke the
# tarball in CLEAN containers (the release-blocking gate: extract ->
# analyze docs/demo.c -> exactly exit 1 with supported findings), upload assets to
# a DRAFT release, and publish only when every leg is green. A release
# that never ran on a clean machine never goes public.
on:
  push:
    tags: ["v*"]
    branches: ["agent/cs3-ch06-s02-u002-platform-support"]
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/setup-msvc-llvm/**'
      - 'scripts/package_release.sh'
      - 'scripts/platform_first_scan.py'
      - 'scripts/test_platform_workflow.py'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Create the single shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" \
              --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = "true" || {
              echo "::error::$GITHUB_REF_NAME is already published; refusing to overwrite it"
              exit 1
            }
            echo "Reusing existing draft for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "CodeSkeptic $GITHUB_REF_NAME" \
              --notes "Draft — assets uploading."
          fi

  linux:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: ubuntu-22.04   # older glibc -> wider binary compatibility
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 (apt.llvm.org — jammy has no in-archive LLVM 20)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev libclang-20-dev clang-20 \
            libzstd-dev zlib1g-dev ninja-build

      - name: Build (portable link flags)
        run: |
          set -o pipefail
          { cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20 \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            && cmake --build build ; } 2>&1 | tee /tmp/build.log

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/ctest.log

      - name: Version must match the tag
        run: |
          v=$(./build/src/codeskeptic --version)
          echo "binary: $v  tag: ${GITHUB_REF_NAME}"
          test "CodeSkeptic ${GITHUB_REF_NAME#v}" = "$v"

      - name: Package
        run: |
          set -o pipefail
          bash scripts/package_release.sh build/src/codeskeptic dist clang-20 \
            2>&1 | tee /tmp/package.log

      - name: Bind Linux inventory to source and build evidence
        # No signing/attestation claim. This profile inventories the Linux
        # dpkg package, not unknown static or target-host dependency versions.
        run: |
          set -euo pipefail
          mkdir /tmp/codeskeptic-build-evidence
          build/src/codeskeptic --capabilities --json > /tmp/codeskeptic-build-evidence/capabilities.json
          code=0
          build/src/codeskeptic docs/demo.c --json /tmp/codeskeptic-build-evidence/report.json || code=$?
          test "$code" -eq 1
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from sys import path
          path.insert(0, 'scripts')
          from generate_sbom import canonical, file_hash
          root = pathlib.Path('/tmp/codeskeptic-build-evidence')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          archives = list(pathlib.Path('dist').glob('codeskeptic-*-linux-x86_64.tar.gz'))
          assert len(archives) == 1
          def record(file):
              p = pathlib.Path(file)
              return {'path': str(p.absolute()), 'sha256': file_hash(p)}
          recipe = {
              'source_sha': source,
              'toolchain': {
                  'profile': 'GitHub ubuntu-22.04 hosted build; runner image not immutable',
                  'clang': subprocess.check_output(['clang-20', '--version'], text=True).splitlines()[0],
                  'cmake': subprocess.check_output(['cmake', '--version'], text=True).splitlines()[0],
                  'llvm': subprocess.check_output(['llvm-config-20', '--version'], text=True).strip()},
              'commands': [
                  'git checkout --detach ' + source,
                  'cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20 -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"',
                  'cmake --build build',
                  'bash scripts/package_release.sh build/src/codeskeptic dist clang-20'],
              'inputs': [dict(name=name, **record(file)) for name, file in [
                  ('build.log', '/tmp/build.log'), ('CMakeCache.txt', 'build/CMakeCache.txt'),
                  ('release-workflow.yml', '.github/workflows/release.yml')]]}
          manifest = {'schema': 'codeskeptic-build-evidence/v1', 'source_sha': source,
                      'archive_sha256': file_hash(archives[0]),
                      'binary_sha256': file_hash(pathlib.Path('build/src/codeskeptic')),
                      'report': record(root / 'report.json'),
                      'capabilities': record(root / 'capabilities.json'), 'recipe': recipe}
          with (root / 'manifest.json').open('xb') as output:
              output.write(canonical(manifest))
          PY
          archives=(dist/codeskeptic-*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          bash scripts/package_release.sh --provenance "${archives[0]}" \
            /tmp/codeskeptic-build-evidence/manifest.json dist/provenance
          python3 -B scripts/generate_sbom.py verify "${archives[0]}" dist/provenance \
            --source-sha "$GITHUB_SHA" --version "${GITHUB_REF_NAME#v}"

      - name: Smoke in clean containers (22.04 + 24.04)
        # The tarball must work on a machine with NO LLVM installed.
        # libc6-dev is installed because analyzing C code needs the
        # target's own libc headers — same requirement as any compiler.
        run: |
          for img in ubuntu:22.04 ubuntu:24.04; do
            echo "=== smoke on $img ==="
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/docs:/demo:ro" "$img" bash -c '
              set -ex
              # ONLY libc6-dev (demo.c needs libc headers). The runtime
              # libraries (zstd/zlib/tinfo/LLVM/...) must come from the
              # package itself — installing them here MASKED a missing
              # bundle for three releases (critique-2 finding).
              apt-get update -qq >/dev/null && apt-get install -y -qq libc6-dev >/dev/null
              tar xzf /dist/codeskeptic-*-linux-*.tar.gz -C /tmp
              cd /tmp/codeskeptic-*
              # Self-contained proof: no unresolved libraries, and the
              # bundled ones resolve from the PACKAGE lib dir, not the host.
              ldd ./bin/codeskeptic | tee /tmp/ldd.txt
              ! grep -q "not found" /tmp/ldd.txt
              # ldd prints the rpath literally (.../pkg/./bin/../lib/...),
              # so assert the resolution PREFIX is the extracted package,
              # not an exact directory shape (first hardened run lesson:
              # the bundle was fine, the regex was not).
              for so in "libLLVM\.so" "libzstd\.so" "libz\.so" "libtinfo\.so"; do
                grep -E "$so" /tmp/ldd.txt | grep -qE "=> /tmp/codeskeptic-" || {
                  echo "SELF-CONTAINED VIOLATION: $so resolves off-package"; exit 1; }
              done
              code=0; out=$(./bin/codeskeptic /demo/demo.c 2>&1) || code=$?
              echo "$out"
              test "$code" -eq 1
              echo "$out" | grep -qi finding' 2>&1 | tee -a /tmp/smoke.log
          done

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/codeskeptic-*-linux-*.tar.gz codeskeptic-linux-x86_64.tar.gz
          gh release upload "$GITHUB_REF_NAME" \
            dist/codeskeptic-*-linux-*.tar.gz \
            codeskeptic-linux-x86_64.tar.gz \
            dist/provenance/*.sbom.json dist/provenance/*.provenance.json --clobber

      - name: Diagnostics -> refs/ci-logs/*
        if: always()
        run: |
          for f in build ctest package smoke; do
            tail -c 25000 "/tmp/$f.log" > "$f.tail.log" 2>/dev/null || true
          done
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f build.tail.log ctest.tail.log package.tail.log smoke.tail.log 2>/dev/null || true
          git commit -qm "release-linux logs @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/release-linux"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/release-linux/${{ job.status }}"

  macos:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 (Homebrew, PINNED — brew's default llvm
              drifts to new majors; the engine is tested on 18/20)
        run: brew install llvm@20 cmake ninja

      - name: Build
        run: |
          set -o pipefail
          { cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$(brew --prefix llvm@20)" \
            && cmake --build build ; } 2>&1 | tee /tmp/build.log

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/ctest.log

      - name: Version must match the tag
        run: |
          v=$(./build/src/codeskeptic --version)
          echo "binary: $v  tag: ${GITHUB_REF_NAME}"
          test "CodeSkeptic ${GITHUB_REF_NAME#v}" = "$v"

      - name: Package
        run: |
          set -o pipefail
          bash scripts/package_release.sh build/src/codeskeptic dist \
            "$(brew --prefix llvm@20)/bin/clang" 2>&1 | tee /tmp/package.log

      - name: Smoke from an unpacked tree outside the repo
        # Relocation check: run from /tmp; the exe-relative bundled
        # headers outrank the baked brew path by resolution order.
        run: |
          tar xzf dist/codeskeptic-*-darwin-*.tar.gz -C /tmp
          cd /tmp/codeskeptic-*
          code=0; out=$(./bin/codeskeptic "$GITHUB_WORKSPACE/docs/demo.c" 2>&1) || code=$?
          echo "$out" | tee /tmp/smoke.log
          echo "exit_code=$code" >> /tmp/smoke.log
          test "$code" -eq 1
          echo "$out" | grep -qi finding
          # P1 proof (external macOS evaluation, v0.4.5): a hopeless
          # sysroot must fail LOUDLY (exit 2), never report a silent
          # Clean + exit 0 with zero coverage. SDKROOT is honored
          # verbatim by design, so pointing it nowhere reproduces the
          # broken-user-machine case on this runner.
          code2=0; out2=$(SDKROOT=/nonexistent/sdk ./bin/codeskeptic "$GITHUB_WORKSPACE/docs/demo.c" 2>&1) || code2=$?
          echo "SDKROOT-invalid exit_code=$code2" | tee -a /tmp/smoke.log
          test "$code2" -eq 2
          echo "$out2" | grep -q "VERDICT UNAVAILABLE"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/codeskeptic-*-darwin-*.tar.gz codeskeptic-darwin-arm64.tar.gz
          gh release upload "$GITHUB_REF_NAME" \
            dist/codeskeptic-*-darwin-*.tar.gz \
            codeskeptic-darwin-arm64.tar.gz --clobber

      - name: Diagnostics -> refs/ci-logs/*
        if: always()
        run: |
          for f in build ctest package smoke; do
            tail -c 25000 "/tmp/$f.log" > "$f.tail.log" 2>/dev/null || true
          done
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f build.tail.log ctest.tail.log package.tail.log smoke.tail.log 2>/dev/null || true
          git commit -qm "release-macos logs @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/release-macos"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/release-macos/${{ job.status }}"

  windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC + LLVM (shared with windows.yml)
        uses: ./.github/actions/setup-msvc-llvm

      - name: Build
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          "-DCMAKE_PREFIX_PATH=C:\llvm\clang+llvm-$env:LLVM_VER-x86_64-pc-windows-msvc"
          && cmake --build build 2>&1 | Tee-Object -FilePath $env:TEMP\build.log

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath $env:TEMP\ctest.log

      - name: Version must match the tag
        shell: pwsh
        run: |
          $v = & .\build\src\codeskeptic.exe --version
          Write-Host "binary: $v  tag: $env:GITHUB_REF_NAME"
          if ($v -ne "CodeSkeptic $($env:GITHUB_REF_NAME.Substring(1))") { throw "version/tag mismatch" }
          exit 0

      - name: Package
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package_release.sh build/src/codeskeptic.exe dist \
            "/c/llvm/clang+llvm-${LLVM_VER}-x86_64-pc-windows-msvc/bin/clang.exe" \
            2>&1 | tee /tmp/package.log

      - name: Relocation smoke (LLVM hidden, plain terminal)
        # Same contract as the Linux clean-container smoke, in Windows
        # terms: the vcvars family is stripped, C:\llvm (build LLVM AND
        # the baked resource dir) is renamed away, and the packaged exe
        # must analyze docs/demo.c from its own bundled headers with
        # exactly exit 1 + supported findings.
        shell: pwsh
        run: |
          $family = '^(INCLUDE|EXTERNAL_INCLUDE|LIB|LIBPATH|DevEnvDir|VSINSTALLDIR|VCINSTALLDIR|VCIDEInstallDir|VCToolsInstallDir|VCToolsVersion|VCToolsRedistDir|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|WindowsSdkVerBinPath|WindowsSDKLibVersion|UniversalCRTSdkDir|UCRTVersion|VSCMD_.*|Framework.*|ExtensionSdkDir)$'
          Get-ChildItem Env: | Where-Object { $_.Name -match $family } | ForEach-Object {
            Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue
          }
          Rename-Item C:\llvm C:\llvm-hidden
          try {
            $zip = Get-ChildItem dist\codeskeptic-*-windows-*.zip | Select-Object -First 1
            Expand-Archive $zip.FullName -DestinationPath "$env:TEMP\cs_pkg" -Force
            $exe = Get-ChildItem "$env:TEMP\cs_pkg" -Recurse -Filter codeskeptic.exe | Select-Object -First 1
            $out = & $exe.FullName docs\demo.c 2>&1 | Out-String
            $code = $LASTEXITCODE
          } finally {
            Rename-Item C:\llvm-hidden C:\llvm
          }
          Write-Host $out
          $out | Set-Content $env:TEMP\smoke.log
          Add-Content $env:TEMP\smoke.log "exit_code=$code"
          if (-not ($code -eq 1 -and $out -match 'finding')) {
            throw "package relocation smoke failed (exit=$code)"
          }
          exit 0

      - name: Upload to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist\codeskeptic-*-windows-*.zip | Select-Object -First 1
          Copy-Item $zip.FullName codeskeptic-windows-x86_64.zip
          gh release upload "$env:GITHUB_REF_NAME" $zip.FullName codeskeptic-windows-x86_64.zip --clobber
          exit 0

      - name: Diagnostics -> refs/ci-logs/*
        if: always()
        shell: bash
        run: |
          for f in build ctest package smoke; do
            tail -c 25000 "$(cygpath -u "$TEMP")/$f.log" > "$f.tail.log" 2>/dev/null || true
          done
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          git add -f build.tail.log ctest.tail.log package.tail.log smoke.tail.log 2>/dev/null || true
          git commit -qm "release-windows logs @ ${{ github.sha }}" || true
          git push --force origin "HEAD:refs/ci-logs/${{ github.sha }}/release-windows"

      - name: Mirror job status to refs/status/*
        if: always()
        shell: bash
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/release-windows/${{ job.status }}"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Combined checksums, then publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -p '*.tar.gz' -p '*.zip' \
            -p '*.sbom.json' -p '*.provenance.json' -D assets
          archives=(assets/codeskeptic-v*-linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          python3 -B scripts/generate_sbom.py verify "${archives[0]}" assets \
            --source-sha "$GITHUB_SHA" --version "${GITHUB_REF_NAME#v}" --pending-checksums
          (cd assets && sha256sum *.tar.gz *.zip *.sbom.json *.provenance.json) > sha256sums.txt
          cat sha256sums.txt
          gh release upload "$GITHUB_REF_NAME" sha256sums.txt --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --title "CodeSkeptic $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --draft=false
      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/release-publish/${{ job.status }}"

  candidate-native:
    # No prepare/release dependency, release token, status ref or Git writer.
    # Branch+path selection avoids repeating native builds for a ledger-only POP.
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/cs3-ch06-s02-u002-platform-support'
    name: candidate-native (${{ matrix.target }})
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x86_64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC and LLVM (explicit cache or upstream download)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-llvm

      - name: Setup macOS LLVM 20 (explicit Homebrew download)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install llvm@20 cmake ninja

      - name: Windows configure, build and full tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'codeskeptic-native-build'
          New-Item -ItemType Directory -Path $logs | Out-Null
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DCMAKE_PREFIX_PATH=C:\llvm\clang+llvm-$env:LLVM_VER-x86_64-pc-windows-msvc" 2>&1 | Tee-Object -FilePath "$logs/configure.log"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build --parallel 2 2>&1 | Tee-Object -FilePath "$logs/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath "$logs/ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
          & .\build\tests\codeskeptic_tests.exe 2>&1 | Tee-Object -FilePath "$logs/single-process.log"
          if ($LASTEXITCODE -ne 0) { throw 'single-process tests failed' }

      - name: macOS configure, build and full tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/codeskeptic-native-build"
          mkdir "$logs"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix llvm@20)" 2>&1 | tee "$logs/configure.log"
          cmake --build build --parallel 2 2>&1 | tee "$logs/build.log"
          ctest --test-dir build --output-on-failure 2>&1 | tee "$logs/ctest.log"
          build/tests/codeskeptic_tests 2>&1 | tee "$logs/single-process.log"

      - name: Package candidate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_release.sh build/src/codeskeptic.exe build/native-dist \
            "/c/llvm/clang+llvm-${LLVM_VER}-x86_64-pc-windows-msvc/bin/clang.exe" \
            2>&1 | tee "$RUNNER_TEMP/codeskeptic-native-build/package.log"

      - name: Package candidate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_release.sh build/src/codeskeptic build/native-dist \
            "$(brew --prefix llvm@20)/bin/clang" 2>&1 | tee "$RUNNER_TEMP/codeskeptic-native-build/package.log"

      - name: Exact Windows artifact first scans with LLVM hidden
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/native-dist -Filter 'codeskeptic-*-windows-x86_64.zip')
          if ($archives.Count -ne 1) { throw 'exactly one candidate archive required' }
          $identity = & .\build\src\codeskeptic.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'native version failed' }
          $version = $identity -replace '^CodeSkeptic ', ''
          $archiveDigest = (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryDigest = (Get-FileHash build/src/codeskeptic.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $original = 'C:\llvm'
          $hidden = 'C:\codeskeptic-qualification-llvm-hidden'
          if ((Test-Path $hidden) -or -not (Test-Path $original -PathType Container)) { throw 'unsafe LLVM hide paths' }
          Move-Item -LiteralPath $original -Destination $hidden
          try {
            python -B scripts/platform_first_scan.py --archive $archives[0].FullName --archive-sha256 $archiveDigest --source-sha $env:GITHUB_SHA --version $version --source-binary-sha256 $binaryDigest --llvm-original $original --llvm-hidden $hidden --output "$env:RUNNER_TEMP/codeskeptic-platform"
            if ($LASTEXITCODE -ne 0) { throw 'Windows artifact qualification failed' }
          } finally {
            Move-Item -LiteralPath $hidden -Destination $original -ErrorAction Stop
          }

      - name: Exact macOS artifact first scans with LLVM hidden
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archives=(build/native-dist/codeskeptic-*-darwin-arm64.tar.gz)
          test "${#archives[@]}" -eq 1 && test -f "${archives[0]}"
          identity=$(build/src/codeskeptic --version)
          version=${identity#CodeSkeptic }
          archive_digest=$(shasum -a 256 "${archives[0]}" | cut -d ' ' -f 1)
          binary_digest=$(shasum -a 256 build/src/codeskeptic | cut -d ' ' -f 1)
          llvm_original=$(cd "$(brew --prefix llvm@20)" && pwd -P)
          case "$llvm_original" in /opt/homebrew/Cellar/llvm@20/*) ;; *) exit 2;; esac
          llvm_hidden="${llvm_original}.codeskeptic-qualification-hidden"
          test -d "$llvm_original" && test ! -e "$llvm_hidden" && test ! -L "$llvm_hidden"
          mv "$llvm_original" "$llvm_hidden"
          restore_llvm() {
            original_status=$?
            trap - EXIT
            mv "$llvm_hidden" "$llvm_original" || exit 2
            exit "$original_status"
          }
          trap restore_llvm EXIT
          python3 -B scripts/platform_first_scan.py --archive "${archives[0]}" \
            --archive-sha256 "$archive_digest" --source-sha "$GITHUB_SHA" --version "$version" \
            --source-binary-sha256 "$binary_digest" --llvm-original "$llvm_original" \
            --llvm-hidden "$llvm_hidden" --output "$RUNNER_TEMP/codeskeptic-platform"

      - name: Retain exact candidate package, scans and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeskeptic-platform/
            ${{ runner.temp }}/codeskeptic-native-build/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
